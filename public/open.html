<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open TravelBuddy in Expo Go</title>
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 3rem 1.5rem; }
    a.button {
      display: inline-block; margin-top: 1.5rem; padding: 0.9rem 1.8rem;
      background: #2563EB; color: white; text-decoration: none;
      border-radius: 10px; font-size: 1.1rem; font-weight: 600;
    }
    p { color: #555; }
    code { background: #f1f5f9; padding: 0.15rem 0.4rem; border-radius: 6px; }
  </style>
  <script>
    // Served by Metro (travelbuddyapp/public), so this page's own address is the
    // dev server Expo Go must load from. Expo Go's exp:// scheme fetches over
    // http and exps:// over https: the public URL (Tailscale Funnel → nginx) is
    // https on the default port; the tailnet/LAN URL is http://<ip>:8082.
    //
    // ?to=/some/route opens that screen: Expo Go loads the project, then follows
    // the path after "/--" (e.g. open.html?to=/auth/login → exps://<host>/--/auth/login).
    // Only in-app paths are accepted ("/x", not "//host" or a full URL).
    var expoUrl = (location.protocol === 'https:' ? 'exps://' : 'exp://') + location.host;
    var to = new URLSearchParams(location.search).get('to');
    if (to && /^\/(?!\/)[\w\-./?=&%()]*$/.test(to)) {
      expoUrl += '/--' + to;
    }
    window.location.href = expoUrl;
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('open').href = expoUrl;
      document.getElementById('url').textContent = expoUrl;
    });
  </script>
</head>
<body>
  <h2>Opening TravelBuddy in Expo Go&hellip;</h2>
  <p>If nothing happens, make sure Expo Go is installed and tap the button below.</p>
  <a id="open" class="button" href="#">Open in Expo Go</a>
  <p>Or in Expo Go choose &ldquo;Enter URL manually&rdquo; and type <code id="url"></code></p>
</body>
</html>
